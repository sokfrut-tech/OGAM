name: Build Jarvis Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Report build mode
        env:
          PRO_SUBMODULE_PAT: ${{ secrets.PRO_SUBMODULE_PAT }}
        shell: bash
        run: |
          if [[ -n "$PRO_SUBMODULE_PAT" ]]; then
            echo "Building with optional Pro submodule token (standalone shared workspace disabled)."
          else
            echo "Building standalone open-core APK without PRO_SUBMODULE_PAT (pro/ uses proStub.js)."
          fi

      - name: Set up Node workspace
        uses: ./.github/actions/setup-mobile
        with:
          private-token: ${{ secrets.PRO_SUBMODULE_PAT }}
          shared: 'false'
          save-caches: 'false'

      - name: Set up Java 17, pinned Android NDK and native runtime
        uses: ./.github/actions/setup-android
        with:
          video: 'true'
          save: 'false'

      - name: Verify bundled Qualcomm QNN runtime assets
        run: bash scripts/verify-qnn-assets.sh

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build arm64 debug APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK and write checksum
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh "$APK"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-OGAM-arm64-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
