name: Publish existing Jarvis APK as public release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-jarvis-arm64-release.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: "15031006793"
      SOURCE_SHA: "750bae3f01ca32c3471c90d95d0367f512737814"
      RELEASE_TAG: "jarvis-ogam-arm64-2026-11-25"
      EXPECTED_SHA256: "85130f7b765787d501a480cdbf8aafcc869b710c3653ddb783b4cf1a43685981"
    steps:
      - name: Validate pinned release inputs
        shell: bash
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Download the already-built workflow artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output jarvis-artifact.zip
          mkdir extracted
          unzip -q jarvis-artifact.zip -d extracted
          mapfile -t apks < <(find extracted -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          echo "APK_PATH=${apks[0]}" >> "$GITHUB_ENV"

      - name: Verify APK checksum
        shell: bash
        run: |
          ACTUAL_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "APK SHA-256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          test -s "$APK_PATH"

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Jarvis OGAM ARM64 — 25 Nov 2026" \
            --notes "Standalone ARM64 APK. Built from commit $SOURCE_SHA. SHA-256: $EXPECTED_SHA256. Build artifact and checksum are verified before publication."
